<!DOCTYPE html>
<html lang="de">

<head>
    <link rel="stylesheet" href="../styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kampagne</title>
</head>

<body>
    <!-- Right navigation drawer -->
    <div id="navBackdrop" class="backdrop" hidden></div>

    <aside id="navDrawer" class="drawer drawer--right" aria-hidden="true">
        <div class="drawer__header">
            <strong>Navigation</strong>
            <button id="btnNavClose" class="btn" type="button" aria-label="Schließen">
                ✕
            </button>
        </div>

        <div id="navList" class="drawer__content">

            <button class="drawer__item" type="button">
                Übersicht
            </button>

            <div class="drawer__section">
                <div class="drawer__title">
                    Spieler
                </div>

                <div class="drawer__list">
                    <button class="drawer__item" type="button">
                        Spielercharaktere
                    </button>
                </div>
            </div>

            <div class="drawer__section">
                <div class="drawer__title">
                    Welt
                </div>

                <div class="drawer__list">
                    <button class="drawer__item" type="button">
                        NPCs
                    </button>

                    <button class="drawer__item" type="button">
                        Gegner
                    </button>

                    <button class="drawer__item" type="button">
                        Items
                    </button>
                </div>
            </div>

            <div class="drawer__section">
                <div class="drawer__title">
                    Spielleitung
                </div>

                <div class="drawer__list">
                    <button class="drawer__item" type="button">
                        Notizen
                    </button>

                    <button class="drawer__item" type="button">
                        Kampf
                    </button>
                </div>
            </div>

        </div>
    </aside>
    <main>
        <button id="btnNavOpen" class="btn" type="button" aria-label="Navigation öffnen">
            ☰
        </button>
        <a href="campaigns.html">← Meine Kampagnen</a>

        <h1 id="campaign-name">Kampagne wird geladen...</h1>

        <section>
            <h2>Spielercharaktere</h2>

            <div id="campaign-characters">
                <p>Charaktere werden geladen...</p>
            </div>
            <button id="show-add-character-button" type="button">
                + Spielercharakter hinzufügen
            </button>

            <div id="add-character-area" hidden>
                <h3>Spielercharakter hinzufügen</h3>

                <div id="available-characters">
                    <p>Charaktere werden geladen...</p>
                </div>

                <button id="cancel-add-character-button" type="button">
                    Abbrechen
                </button>
            </div>
        </section>
    </main>

    <script type="module" src="campaign.js"></script>
</body>

</html>
