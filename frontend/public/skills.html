<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>D&D 5E – Fertigkeiten</title>
    <link rel="stylesheet" href="./styles.css" />
</head>

<body class="app">
    <!-- Topbar -->
    <header class="appbar">
        <div class="appbar__character">
            <button id="btnMenu" class="appbar__drawerToggle" type="button" aria-label="Charaktere öffnen"
                title="Charaktere">
                ‹
            </button>

            <button id="btnCharacterInfo" class="appbar__characterInfo" type="button"
                aria-label="Charakterdaten bearbeiten">
                <span id="topbarCharacterName" class="appbar__characterName">
                    Kein Charakter
                </span>

                <span id="topbarCharacterMeta" class="appbar__characterMeta">
                    —
                </span>
            </button>

            <button id="btnCharacterLevel" class="appbar__levelButton" type="button" aria-label="Stufe ändern"
                title="Stufe ändern">
                <span class="appbar__levelLabel">Stufe</span>
                <span id="topbarCharacterLevel" class="appbar__levelValue">—</span>
            </button>
        </div>

        <div id="currentCharacterAvatar" class="topbarCharacterAvatar" hidden
            aria-label="Aktuell ausgewählter Charakter" title="Zur Übersicht">
            <img id="currentCharacterAvatarImg" class="topbarCharacterAvatar__img" alt="Charakterbild" hidden />

            <div id="currentCharacterAvatarFallback" class="topbarCharacterAvatar__fallback">
                ?
            </div>
        </div>

        <button id="btnNavOpen" class="appbar__navButton" type="button" aria-label="Navigation öffnen"
            title="Navigation">
            ☰
        </button>
    </header>

    <!-- Drawer -->
    <div id="drawer" class="drawer" aria-hidden="true">
        <div class="drawer__header">
            <strong id="drawerUserTitle">Charaktere</strong>
            <button id="btnCloseDrawer" class="btn" aria-label="Schließen">✕</button>
        </div>

        <div class="drawer__content">
            <div class="drawer__section">
                <button type="button" class="drawer__title drawer__toggle" id="toggleMine" aria-expanded="true">
                    Charaktere
                </button>

                <div id="listMine" class="drawer__list">
                    <button class="drawer__item" disabled>
                        (noch keine Daten)
                    </button>
                </div>
            </div>

            <div class="drawer__section">
                <button type="button" class="drawer__title drawer__toggle" id="toggleNpcs" aria-expanded="false">
                    NPCs
                </button>

                <div id="listNpcs" class="drawer__list" hidden>
                    <button class="drawer__item" disabled>
                        (noch keine Daten)
                    </button>
                </div>
            </div>

            <button id="btnPlayerRules" class="drawer__item" type="button">
                Spielerhandbuch
            </button>

            <div class="drawer__footer">
                <button id="btnLogout" class="drawer__item" type="button">
                    Abmelden
                </button>
            </div>
        </div>
    </div>

    <main class="page page--skills">
        <section id="sec-skills" class="skills" data-nav-label="Fertigkeiten" tabindex="-1">
            <h3>Fertigkeiten</h3>

            <div class="skillCard">
                <div class="skillCard__header">
                    <span class="skillCard__title">Stärke</span>
                </div>

                <div class="skillEntry">
                    <label class="skillEntry__profControl" for="skill_athletics_prof">
                        <input id="skill_athletics_prof" class="skillEntry__prof" type="checkbox" />
                        <span class="skillEntry__indicator" aria-hidden="true"></span>
                        <span class="skillEntry__name">Athletik</span>
                    </label>

                    <label class="skillEntry__bonusWrap">
                        <span class="skillEntry__smallLabel">Bonus</span>
                        <input id="skill_athletics_bonus" class="skillEntry__bonus" type="number" value="0" step="1" />
                    </label>

                    <div class="skillEntry__valueWrap">
                        <span class="skillEntry__smallLabel">Gesamt</span>
                        <input id="skill_athletics" class="skillEntry__value" type="number" readonly tabindex="-1" />
                    </div>
                </div>
            </div>


            <div class="skillCard">
                <div class="skillCard__header">

                </div>

                    </div>
                </div>

                <div class="skillEntry">
                    <label class="skillEntry__profControl" for="skill_sleight_of_hand_prof">

                    <div class="skillEntry__valueWrap">
                        <span class="skillEntry__smallLabel">Gesamt</span>
                        <input id="skill_sleight_of_hand" class="skillEntry__value" type="number" readonly

                    <div class="skillEntry__valueWrap">

    <!-- Navigation Drawer -->
    <div id="navBackdrop" class="backdrop" hidden></div>

    <aside id="navDrawer" class="drawer drawer--right" aria-hidden="true">
        <div class="drawer__header">
            <strong>Navigation</strong>
            <button id="btnNavClose" class="btn" aria-label="Schließen">✕</button>
        </div>
        <div id="navList" class="drawer__content">
            <!-- Items kommen per JS -->
        </div>
    </aside>
    <script type="module" src="/app.js"></script>
    <script type="module" src="/skills.js"></script>
</body>

</html>
