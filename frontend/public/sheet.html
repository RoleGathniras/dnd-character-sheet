<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DnD Character Sheet</title>
    <link rel="stylesheet" href="/styles.css" />
</head>

<body>
    <!-- Appbar -->
    <header class="appbar">
        <div class="appbar__character">
            <button id="btnMenu" class="appbar__drawerToggle" type="button" aria-label="Charaktere öffnen"
                title="Charaktere">
                ‹
            </button>

            <button id="btnCharacterInfo" class="appbar__characterInfo" type="button"
                aria-label="Charakterdaten bearbeiten">
                <span id="topbarCharacterName" class="appbar__characterName">
                    Kein Charakter
                </span>

                <span id="topbarCharacterMeta" class="appbar__characterMeta">
                    —
                </span>
            </button>
            <button id="btnCharacterLevel" class="appbar__levelButton" type="button" aria-label="Stufe ändern"
                title="Stufe ändern">
                <span class="appbar__levelLabel">Stufe</span>
                <span id="topbarCharacterLevel" class="appbar__levelValue">—</span>
            </button>
        </div>

        <div id="currentCharacterAvatar" class="topbarCharacterAvatar" hidden
            aria-label="Aktuell ausgewählter Charakter" title="Zur Übersicht">
            <img id="currentCharacterAvatarImg" class="topbarCharacterAvatar__img" alt="Charakterbild" hidden />
            <div id="currentCharacterAvatarFallback" class="topbarCharacterAvatar__fallback">
                ?
            </div>
        </div>

        <button id="btnNavOpen" class="appbar__navButton" type="button" aria-label="Navigation öffnen"
            title="Navigation">
            ☰
        </button>
    </header>

    <!-- Drawer -->
    <div id="drawer" class="drawer" aria-hidden="true">
        <div class="drawer__header">
            <strong id="drawerUserTitle">Charaktere</strong>
            <button id="btnCloseDrawer" class="btn" aria-label="Schließen">✕</button>
        </div>

        <div class="drawer__content">
            <div class="drawer__section">
                <button type="button" class="drawer__title drawer__toggle" id="toggleMine" aria-expanded="true">
                    Charaktere
                </button>

                <div id="listMine" class="drawer__list">
                    <button class="drawer__item" disabled>
                        (noch keine Daten)
                    </button>
                </div>
            </div>

            <div class="drawer__section">
                <button type="button" class="drawer__title drawer__toggle" id="toggleNpcs" aria-expanded="false">
                    NPCs
                </button>

                <div id="listNpcs" class="drawer__list" hidden>
                    <button class="drawer__item" disabled>
                        (noch keine Daten)
                    </button>
                </div>
            </div>

            <button id="btnPlayerRules" class="drawer__item" type="button">
                Spielerhandbuch
            </button>

            <div class="drawer__footer">
                <button id="btnLogout" class="drawer__item" type="button">
                    Abmelden
                </button>
            </div>
        </div>
    </div>

    <div id="backdrop" class="backdrop" hidden></div>

    <!-- Right nav drawer -->
    <div id="navBackdrop" class="backdrop" hidden></div>
    <aside id="navDrawer" class="drawer drawer--right" aria-hidden="true">
        <div class="drawer__header">
            <strong>Navigation</strong>
            <button id="btnNavClose" class="btn" aria-label="Schließen">✕</button>
        </div>
        <div id="navList" class="drawer__content"></div>
    </aside>

    <!-- Content -->
    <main class="page--sheet">
        <section class="sheet" id="sheetRoot">
            <section id="sec-values" data-nav-label="Werte" tabindex="-1">
                <div class="sheetTopGrid">
                    <div class="topBlock topBlock--inspiration">
                        <label class="inspirationField">
                            Inspiration
                            <div class="inspirationInner">
                                <input id="inspiration" type="checkbox" />
                                <span>Extra Wurf</span>
                            </div>
                        </label>
                    </div>

                    <label class="topField topField--pb">Übungsbonus
                        <input id="proficiency_bonus" type="number" min="2" max="6" step="1" />
                    </label>

                    <label class="topField topField--speed">Bewegungsrate (m)
                        <input id="speed" type="number" min="0" max="40" step="1.5" />
                    </label>
                </div>
            </section>

            <div class="sheetTwoCol">
                <section id="sec-abilities" class="abilities" tabindex="-1">
                    <section id="sec-attributes" data-nav-label="Attribute" tabindex="-1">
                        <h3></h3>

                        <div class="abilityCard">
                            <div class="abilityHead">Stärke</div>
                            <input id="str" type="number" min="0" max="30" step="1" inputmode="numeric" />
                            <div class="modBadge">
                                <span class="modLabel">MOD</span>
                                <input id="str_mod" type="number" readonly />
                            </div>
                        </div>
                        <div class="abilityCard">
                            <div class="abilityHead">Geschicklichkeit</div>
                            <input id="dex" type="number" min="0" max="30" step="1" inputmode="numeric" />
                            <div class="modBadge">
                                <span class="modLabel">MOD</span>
                                <input id="dex_mod" type="number" readonly />
                            </div>
                        </div>
                        <div class="abilityCard">
                            <div class="abilityHead">Konstitution</div>
                            <input id="con" type="number" min="0" max="30" step="1" inputmode="numeric" />
                            <div class="modBadge">
                                <span class="modLabel">MOD</span>
                                <input id="con_mod" type="number" readonly />
                            </div>
                        </div>
                        <div class="abilityCard">
                            <div class="abilityHead">Intelligenz</div>
                            <input id="int" type="number" min="0" max="30" step="1" inputmode="numeric" />
                            <div class="modBadge">
                                <span class="modLabel">MOD</span>
                                <input id="int_mod" type="number" readonly />
                            </div>
                        </div>
                        <div class="abilityCard">
                            <div class="abilityHead">Weisheit</div>
                            <input id="wis" type="number" min="0" max="30" step="1" inputmode="numeric" />
                            <div class="modBadge">
                                <span class="modLabel">MOD</span>
                                <input id="wis_mod" type="number" readonly />
                            </div>
                        </div>
                        <div class="abilityCard">
                            <div class="abilityHead">Charisma</div>
                            <input id="cha" type="number" min="0" max="30" step="1" inputmode="numeric" />
                            <div class="modBadge">
                                <span class="modLabel">MOD</span>
                                <input id="cha_mod" type="number" readonly />
                            </div>
                        </div>
                    </section>

                    <section id="sec-saves" data-nav-label="Rettungswürfe" tabindex="-1">
                        <h3>Rettungswürfe</h3>
                        <div class="saveList saveList--modern">

                            <div class="saveEntry">
                                <label class="saveEntry__profControl" for="save_str_prof">
                                    <input id="save_str_prof" class="saveEntry__prof" type="checkbox" />
                                    <span class="saveEntry__indicator" aria-hidden="true"></span>
                                    <span class="saveEntry__name">Stärke</span>
                                </label>

                                <label class="saveEntry__bonusWrap">
                                    <span class="saveEntry__smallLabel">Bonus</span>
                                    <input id="save_str_bonus" class="saveEntry__bonus" type="number" value="0"
                                        step="1" />
                                </label>

                                <div class="saveEntry__valueWrap">
                                    <span class="saveEntry__smallLabel">Gesamt</span>
                                    <input id="save_str" class="saveEntry__value" type="number" readonly
                                        tabindex="-1" />
                                </div>
                            </div>

                            <div class="saveEntry">
                                <label class="saveEntry__profControl" for="save_dex_prof">
                                    <input id="save_dex_prof" class="saveEntry__prof" type="checkbox" />
                                    <span class="saveEntry__indicator" aria-hidden="true"></span>
                                    <span class="saveEntry__name">Geschicklichkeit</span>
                                </label>

                                <label class="saveEntry__bonusWrap">
                                    <span class="saveEntry__smallLabel">Bonus</span>
                                    <input id="save_dex_bonus" class="saveEntry__bonus" type="number" value="0"
                                        step="1" />
                                </label>

                                <div class="saveEntry__valueWrap">
                                    <span class="saveEntry__smallLabel">Gesamt</span>
                                    <input id="save_dex" class="saveEntry__value" type="number" readonly
                                        tabindex="-1" />
                                </div>
                            </div>

                            <div class="saveEntry">
                                <label class="saveEntry__profControl" for="save_con_prof">
                                    <input id="save_con_prof" class="saveEntry__prof" type="checkbox" />
                                    <span class="saveEntry__indicator" aria-hidden="true"></span>
                                    <span class="saveEntry__name">Konstitution</span>
                                </label>

                                <label class="saveEntry__bonusWrap">
                                    <span class="saveEntry__smallLabel">Bonus</span>
                                    <input id="save_con_bonus" class="saveEntry__bonus" type="number" value="0"
                                        step="1" />
                                </label>

                                <div class="saveEntry__valueWrap">
                                    <span class="saveEntry__smallLabel">Gesamt</span>
                                    <input id="save_con" class="saveEntry__value" type="number" readonly
                                        tabindex="-1" />
                                </div>
                            </div>

                            <div class="saveEntry">
                                <label class="saveEntry__profControl" for="save_int_prof">
                                    <input id="save_int_prof" class="saveEntry__prof" type="checkbox" />
                                    <span class="saveEntry__indicator" aria-hidden="true"></span>
                                    <span class="saveEntry__name">Intelligenz</span>
                                </label>

                                <label class="saveEntry__bonusWrap">
                                    <span class="saveEntry__smallLabel">Bonus</span>
                                    <input id="save_int_bonus" class="saveEntry__bonus" type="number" value="0"
                                        step="1" />
                                </label>

                                <div class="saveEntry__valueWrap">
                                    <span class="saveEntry__smallLabel">Gesamt</span>
                                    <input id="save_int" class="saveEntry__value" type="number" readonly
                                        tabindex="-1" />
                                </div>
                            </div>

                            <div class="saveEntry">
                                <label class="saveEntry__profControl" for="save_wis_prof">
                                    <input id="save_wis_prof" class="saveEntry__prof" type="checkbox" />
                                    <span class="saveEntry__indicator" aria-hidden="true"></span>
                                    <span class="saveEntry__name">Weisheit</span>
                                </label>

                                <label class="saveEntry__bonusWrap">
                                    <span class="saveEntry__smallLabel">Bonus</span>
                                    <input id="save_wis_bonus" class="saveEntry__bonus" type="number" value="0"
                                        step="1" />
                                </label>

                                <div class="saveEntry__valueWrap">
                                    <span class="saveEntry__smallLabel">Gesamt</span>
                                    <input id="save_wis" class="saveEntry__value" type="number" readonly
                                        tabindex="-1" />
                                </div>
                            </div>

                            <div class="saveEntry">
                                <label class="saveEntry__profControl" for="save_cha_prof">
                                    <input id="save_cha_prof" class="saveEntry__prof" type="checkbox" />
                                    <span class="saveEntry__indicator" aria-hidden="true"></span>
                                    <span class="saveEntry__name">Charisma</span>
                                </label>

                                <label class="saveEntry__bonusWrap">
                                    <span class="saveEntry__smallLabel">Bonus</span>
                                    <input id="save_cha_bonus" class="saveEntry__bonus" type="number" value="0"
                                        step="1" />
                                </label>

                                <div class="saveEntry__valueWrap">
                                    <span class="saveEntry__smallLabel">Gesamt</span>
                                    <input id="save_cha" class="saveEntry__value" type="number" readonly
                                        tabindex="-1" />
                                </div>
                            </div>

                        </div>

                        <h3>Vorteile / Nachteile</h3>
                        <label>
                            Notizen (z.B. Vorteil bei RW gegen Gift, Nachteil bei Weisheit etc.)
                            <textarea id="notes_adv_dis" rows="4" maxlength="1000"
                                placeholder="z. B. Vorteil bei RW gegen Gift, Nachteil bei Wahrnehmung im Dunkeln"></textarea>
                        </label>
                    </section>

                    <section id="sec-passives" data-nav-label="Passive Werte" tabindex="-1">
                        <h3>Passive Werte</h3>
                        <div class="passiveList">
                            <label>Passive Wahrnehmung
                                <input id="passive_perception" type="number" readonly />
                            </label>

                            <label>Passive Nachforschungen
                                <input id="passive_investigation" type="number" readonly />
                            </label>

                            <label>Passive Motiv erkennen
                                <input id="passive_insight" type="number" readonly />
                            </label>
                        </div>
                    </section>
                </section>
            </div>

            <section class="combatSection">
                <div class="combatGrid">
                    <section id="sec-deathsaves" class="combatCard" data-nav-label="Deathsaves" tabindex="-1">
                        <h4>Death Saves</h4>
                        <div class="deathSaves">
                            <div class="deathCol">
                                <div class="deathLabel">Erfolge</div>
                                <div class="deathRow">
                                    <label class="deathDot"><input id="death_success_1"
                                            type="checkbox" /><span>1</span></label>
                                    <label class="deathDot"><input id="death_success_2"
                                            type="checkbox" /><span>2</span></label>
                                    <label class="deathDot"><input id="death_success_3"
                                            type="checkbox" /><span>3</span></label>
                                </div>
                            </div>

                            <div class="deathCol">
                                <div class="deathLabel">Fehlschläge</div>
                                <div class="deathRow">
                                    <label class="deathDot"><input id="death_fail_1"
                                            type="checkbox" /><span>1</span></label>
                                    <label class="deathDot"><input id="death_fail_2"
                                            type="checkbox" /><span>2</span></label>
                                    <label class="deathDot"><input id="death_fail_3"
                                            type="checkbox" /><span>3</span></label>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </section>
        </section>
    </main>

    <script type="module" src="/sheet.js"></script>
    <script type="module" src="/app.js"></script>
</body>

</html>
